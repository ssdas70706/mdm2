<!DOCTYPE html>
<html lang="zh-TW" style="background-color: #53c643;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>國軍MDM V8.1</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國軍MDM">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #53c643;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 滿版純黑導覽列佔位（確保動態島周圍全黑） */
        .navbar-placeholder {
            background-color: #000000;
            width: 100%;
            height: calc(48px + env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .navbar {
            background-color: #000000;
            width: 100%;
            height: 48px;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: env(safe-area-inset-top); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 9999;
            box-content: content-box;
        }

        .menu-icon {
            position: absolute;
            left: 18px;
            bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 15px;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #ffffff;
        }

        /* 主體內容區塊 */
        .content {
            flex: 1;
            width: 100%;
            max-width: 430px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }

        .ios-version {
            align-self: flex-end;
            font-size: 16px;
            color: #000000;
            margin-top: 5px;
            margin-right: 2px;
            font-weight: 500;
        }

        .end-time {
            font-size: 28px;
            font-weight: bold;
            margin-top: 2px;
            letter-spacing: -0.5px;
        }

        .title-banner {
            font-size: 86px;
            font-weight: 950;
            margin-top: 10px;
            letter-spacing: -1px;
        }

        .current-time {
            font-size: 38px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .btn-container {
            width: 100%;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 0 10px;
        }

        .btn {
            width: 100%;
            height: 52px;
            border-radius: 18px;
            background-color: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .btn-lock { color: rgba(0, 0, 0, 0.3); }
        .btn-unlock { color: #2b7eff; }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .dot-green { background-color: #8ce87d; opacity: 0.5; }
        .dot-red { background-color: #ff3b30; }

        .tag-box {
            background-color: #ffffff;
            width: 86%;
            border-radius: 20px;
            padding: 16px 10px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tag-text {
            font-size: 23px;
            font-weight: bold;
            color: #000000;
            line-height: 1.4;
            text-align: center;
            letter-spacing: 2px;
        }

        .tag-id {
            font-size: 36px;
            font-weight: 900;
            color: #000000;
            margin-top: 2px;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
        }

        .info-footer {
            width: 100%;
            text-align: center;
            position: absolute;
            bottom: 25px;
            font-size: 21px;
            font-weight: bold;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .warning-text {
            color: #ff3b30;
            font-size: 16px;
            font-weight: 900;
            margin-top: 4px;
            letter-spacing: 6px;
            text-indent: 6px;
        }
    </style>
</head>
<body>

    <div class="navbar-placeholder"></div>
    <div class="navbar">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        國軍MDM V8.1
    </div>

    <div class="content">
        <div class="ios-version">iOS:26.4.2</div>
        <div class="end-time">結束時間:115/5/15 12:00</div>
        <div class="title-banner">任務模式</div>
        
        <div class="current-time" id="liveClock">05/18 07:26:02</div>

        <div class="btn-container">
            <div class="btn btn-lock">
                <span class="dot dot-green"></span>上鎖：進入管制模式
            </div>
            <div class="btn btn-unlock">
                <span class="dot dot-red"></span>解鎖：離開管制模式
            </div>
        </div>

        <div class="tag-box">
            <div class="tag-text">國軍營內民用通信</div>
            <div class="tag-text">資訊器材管制標籤</div>
            <div class="tag-id">C228919127</div>
        </div>

        <div class="info-footer">
            <div>上鎖時間：115/04/29 07:23:59</div>
            <div>設定檔：V2.0 (02/22 15:35:58)</div>
            <div class="warning-text">仿冒必究</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('liveClock').textContent = `${month}/${date} ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
