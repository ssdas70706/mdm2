<!DOCTYPE html>
<html lang="zh-TW" style="background-color: #53c643;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>國軍MDM V8.1</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國軍MDM">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #53c643;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 頂部純黑導覽列佔位 */
        .navbar-placeholder {
            background-color: #000000;
            width: 100%;
            height: calc(50px + env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .navbar {
            background-color: #000000;
            width: 100%;
            height: 50px;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: env(safe-area-inset-top); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 9999;
            box-content: content-box;
        }

        .menu-icon {
            position: absolute;
            left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
        }

        .menu-icon span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #ffffff;
        }

        /* 主體內容區塊 - 強化絕對置中控制 */
        .content {
            flex: 1;
            width: 100%;
            max-width: 414px; /* 對齊 iPhone 標準寬度欄位 */
            display: flex;
            flex-direction: column;
            align-items: center; /* 水平置中 */
            text-align: center;  /* 確保純文字元素置中 */
            padding: 0 24px;
            position: relative;
        }

        /* iOS 版本號 - 維持靠右 */
        .ios-version {
            align-self: flex-end;
            font-size: 13px;
            color: #000000;
            margin-top: 6px;
            margin-right: 4px;
            font-weight: 500;
        }

        /* 修正：結束時間微調小 */
        .end-time {
            font-size: 23px;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: -0.5px;
            width: 100%;
        }

        /* 修正：任務模式字體大小下修、精準置中 */
        .title-banner {
            font-size: 64px; /* 從 74px 調小 */
            font-weight: bold;
            margin-top: 14px;
            letter-spacing: 1px;
            width: 100%;
        }

        /* 修正：當下手機時間調小 */
        .current-time {
            font-size: 30px; /* 從 34px 調小 */
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 0.2px;
            width: 100%;
        }

        /* 按鈕容器 */
        .btn-container {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 28px; /* 寬度微調窄 */
        }

        .btn {
            width: 100%;
            height: 40px;
            border-radius: 11px;
            background-color: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15.5px;
            font-weight: bold;
        }

        .btn-lock { color: rgba(0, 0, 0, 0.35); }
        .btn-unlock { color: #1c73e8; }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .dot-green { background-color: #7ee36b; opacity: 0.6; }
        .dot-red { background-color: #ff3b30; }

        /* 管制標籤白框 - 微調窄符合比例 */
        .tag-box {
            background-color: #ffffff;
            width: 80%;
            border-radius: 18px;
            padding: 14px 10px;
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 修正：白框內字體微調小 */
        .tag-text {
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            line-height: 1.4;
            text-align: center;
            letter-spacing: 1px;
        }

        .tag-id {
            font-size: 27px;
            font-weight: bold;
            color: #000000;
            margin-top: 4px;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
        }

        /* 下方詳細資訊 - 置中補正 */
        .info-footer {
            width: 100%;
            text-align: center;
            position: absolute;
            bottom: 25px;
            font-size: 16.5px;
            font-weight: bold;
            line-height: 1.4;
        }

        .warning-text {
            color: #ff3b30;
            font-size: 14px;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: 4px;
            text-indent: 4px;
        }
    </style>
</head>
<body>

    <div class="navbar-placeholder"></div>
    <div class="navbar">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        國軍MDM V8.1
    </div>

    <div class="content">
        <div class="ios-version">iOS:26.4.2</div>
        <div class="end-time">結束時間:115/5/15 12:00</div>
        <div class="title-banner">任務模式</div>
        
        <div class="current-time" id="liveClock">05/18 08:06:09</div>

        <div class="btn-container">
            <div class="btn btn-lock">
                <span class="dot dot-green"></span>上鎖：進入管制模式
            </div>
            <div class="btn btn-unlock">
                <span class="dot dot-red"></span>解鎖：離開管制模式
            </div>
        </div>

        <div class="tag-box">
            <div class="tag-text">國軍營內民用通信</div>
            <div class="tag-text">資訊器材管制標籤</div>
            <div class="tag-id">C228919127</div>
        </div>

        <div class="info-footer">
            <div>上鎖時間：115/04/29 07:23:59</div>
            <div>設定檔：V2.0 (02/22 15:35:58)</div>
            <div class="warning-text">仿冒必究</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('liveClock').textContent = `${month}/${date} ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
