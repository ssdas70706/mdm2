<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>國軍MDM V8.1</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國軍MDM">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #53c643;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 關鍵修正：強行將黑色背景推到最頂端，覆蓋狀態列與動態島區域 */
        .navbar-placeholder {
            background-color: #000000;
            width: 100%;
            height: calc(48px + env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .navbar {
            background-color: #000000;
            width: 100%;
            height: 48px;
            position: fixed;
            top: 0;
            left: 0;
            /* 自動加上 iPhone 頂部安全區域（動態島/瀏海高度） */
            padding-top: env(safe-area-inset-top); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 9999;
            box-content: content-box;
        }

        .menu-icon {
            position: absolute;
            left: 18px;
            bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 15px;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #ffffff;
        }

        /* 主體內容區塊 */
        .content {
            flex: 1;
            width: 100%;
            max-width: 430px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }

        /* iOS 版本號 */
        .ios-version {
            align-self: flex-end;
            font-size: 16px;
            color: #000000;
            margin-top: 5px;
            margin-right: 2px;
            font-weight: 500;
        }

        /* 結束時間 */
        .end-time {
            font-size: 28px;
            font-weight: bold;
            margin-top: 2px;
            letter-spacing: -0.5px;
        }

        /* 任務模式大字 */
        .title-banner {
            font-size: 86px;
            font-weight: 950;
            margin-top: 10px;
            letter-spacing: -1px;
        }

        /* 當下手機動態時間 */
        .current-time {
            font-size: 38px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* 按鈕樣式 */
        .btn-container {
            width: 100%;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 0 10px;
        }

        .btn {
            width: 100%;
            height: 52px;
            border-radius: 18px;
            background-color: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .btn-lock {
            color: rgba(0, 0, 0, 0.3);
        }

        .btn-unlock {
            color: #2b7eff;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .dot-green { background-color: #8ce87d; opacity: 0.5; }
        .dot-red { background-color: #ff3b30; }

        /* 管制標籤白框 */
        .tag-box {
            background-color: #ffffff;
            width: 86%;
            border-radius: 20px;
            padding: 16px 10px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tag-text {
            font-size: 23px;
            font-weight: bold;
            color: #000000;
            line-height: 1.4;
