<!DOCTYPE html>
<html lang="zh-TW" style="background-color: #53c643;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>國軍MDM V8.1</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國軍MDM">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #53c643;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 頂部純黑導覽列佔位 */
        .navbar-placeholder {
            background-color: #000000;
            width: 100%;
            height: calc(50px + env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .navbar {
            background-color: #000000;
            width: 100%;
            height: 50px;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: env(safe-area-inset-top); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 9999;
            box-content: content-box;
        }

        .menu-icon {
            position: absolute;
            left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
        }

        .menu-icon span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #ffffff;
        }

        /* 主體內容區塊 */
        .content {
            flex: 1;
            width: 100%;
            max-width: 414px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;  
            padding: 0 24px;
            position: relative;
        }

        /* iOS 版本號 */
        .ios-version {
            align-self: flex-end;
            font-size: 13px;
            color: #000000;
            margin-top: 6px;
            margin-right: 4px;
            font-weight: 500;
        }

        /* 結束時間 */
        .end-time {
            font-size: 23px;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: -0.5px;
            width: 100%;
        }

        /* 修正：「任務模式」大字直接減半縮小、調薄一倍 */
        .title-banner {
            font-size: 32px;      /* 從 64px 縮小一倍 */
            font-weight: 300;      /* 從 bold(700) 調細一倍至 Light 細體 */
            margin-top: 14px;
            letter-spacing: 2px;
            width: 100%;
        }

        /* 當下手機時間 */
        .current-time {
            font-size: 30px; 
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 0.2px;
            width: 100%;
        }

        /* 按鈕容器 */
        .btn-container {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 28px; 
        }

        .btn {
            width: 100%;
            height: 40px;
            border-radius: 11px;
            background-color: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15.5px;
            font-weight: bold;
        }

        .btn-lock { color: rgba(0, 0, 0, 0.35); }
        .btn-unlock { color: #1c73e8; }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 8px;
        }
